version: '3.8'

services:
  phantom-ide:
    build: .
    container_name: phantom-code
    ports:
      - "8080:8080"
      - "3458:3458"
    volumes:
      - ./workspace:/home/coder/project
      - ./config:/root/.local/share/code-server
      - ./ccr-config:/root/.claude-code-router
    restart: unless-stopped
    # Using root user to allow arbitrary installs inside the container
    user: root
